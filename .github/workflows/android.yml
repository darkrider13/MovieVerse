name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Storage permission for Android 9 and older (Documents export)
        run: |
          m=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' "$m"
          grep -n "EXTERNAL_STORAGE" "$m"
      - name: Plain native splash (logo and tagline are shown by the app)
        run: |
          res=android/app/src/main/res
          find $res -path '*/drawable*' -name 'splash*.png' -delete
          mkdir -p $res/drawable
          cat > $res/drawable/splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0a0b18"/>
          </shape>
          XML
      - name: Black window background (no grey screen when the app restarts after a long time in background)
        run: |
          s=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:windowBackground">@android:color/black</item>' "$s"
          grep -n -A4 'name="AppTheme.NoActionBar"' "$s"
      - name: Hide native WebView scrollbars
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -n1)
          pkg=$(grep -m1 '^package ' "$f" | sed 's/package //; s/;//')
          cat > "$f" <<JAVA
          package $pkg;

          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      View w = getBridge().getWebView();
                      w.setVerticalScrollBarEnabled(false);
                      w.setHorizontalScrollBarEnabled(false);
                  }
              }
          }
          JAVA
      - name: Generate app icons (black background)
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, glob
          res = 'android/app/src/main/res'
          src = Image.open('icon-source.png').convert('RGBA')
          logo = src.crop(src.split()[3].getbbox())
          big = logo.resize((2048, 2048), Image.LANCZOS)
          def place(size, frac, black, rnd=False):
              can = Image.new('RGBA', (size, size), (0, 0, 0, 255) if black else (0, 0, 0, 0))
              n = int(size * frac)
              can.alpha_composite(big.resize((n, n), Image.LANCZOS), ((size - n) // 2, (size - n) // 2))
              if rnd:
                  m = Image.new('L', (size * 4, size * 4), 0)
                  ImageDraw.Draw(m).ellipse((0, 0, size * 4 - 1, size * 4 - 1), fill=255)
                  can.putalpha(m.resize((size, size), Image.LANCZOS))
              return can
          for f in glob.glob(res + '/**/ic_launcher*.webp', recursive=True):
              os.remove(f)
          for d, (l, f) in {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}.items():
              p = res + '/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              place(l, .70, True).convert('RGB').save(p + '/ic_launcher.png')
              place(l, .70, True, True).save(p + '/ic_launcher_round.png')
              place(f, .56, False).save(p + '/ic_launcher_foreground.png')
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(res + '/mipmap-anydpi-v26/' + n + '.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n')
          PY
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MovieVerse.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MovieVerse.apk --title "MovieVerse APK" --notes "Latest build" --target ${{ github.sha }}
