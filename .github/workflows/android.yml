name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Signing key from GitHub Secret + rising version code (so every new APK installs over the old one)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KS" || { echo "Secret SIGNING_KEYSTORE_BASE64 is missing (Settings > Secrets and variables > Actions)"; exit 1; }
          mkdir -p ~/.android
          # tolerate spaces / line breaks / Windows CRLF pasted into the secret
          echo "$KS" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore
          # defaults match the standard Android debug key; set the optional secrets only if your keystore uses other values
          export KS_ALIAS="${KS_ALIAS:-androiddebugkey}" KS_PASS="${KS_PASS:-android}"
          export KEY_PASS="${KEY_PASS:-$KS_PASS}"
          echo "KS_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"; echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"; echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "== Keystore fingerprint (must be the same on every build) =="
          keytool -list -v -keystore ~/.android/debug.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" | grep -E "Alias name|SHA256|Valid" \
            || { echo "Cannot open keystore: wrong alias or password. Add secrets SIGNING_KEY_ALIAS / SIGNING_STORE_PASSWORD / SIGNING_KEY_PASSWORD."; exit 1; }
          # version code always rises (minutes since 1970), even if the repo or run counter is ever reset
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Show APK signature (compare with the keystore fingerprint above)
        run: |
          bt=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          $bt/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256|Signer #1 certificate DN"
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MovieVerse.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MovieVerse.apk --title "MovieVerse APK" --notes "Latest build" --target ${{ github.sha }}
