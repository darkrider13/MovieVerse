name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d2.outputs.page_url || steps.d1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      # GitHub sometimes lists the just-uploaded artifact a few seconds late ("Found 0 artifact(s)"),
      # so wait a little first and retry once if the first attempt still fails
      - name: Wait for artifact to be visible
        run: sleep 10
      - id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry after a pause
        if: steps.d1.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
