<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1120">
<title>MovieVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1120;--s:#181b2f;--s2:#222640;--ink:#eef0fb;--mut:#9aa0c0;--line:#2b3052;--acc:#ff5d73;--onacc:#fff;--w:#2fbf85;--p:#e8a33d;--n:#9a7bff}
@media(prefers-color-scheme:light){:root{--bg:#f3f4fa;--s:#fff;--s2:#eceefa;--ink:#161830;--mut:#5c6286;--line:#d9dcef;--acc:#e0344f;--w:#12865a;--p:#a96600;--n:#6a46d9}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Bricolage Grotesque',system-ui,-apple-system,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-right:auto}
.brand i{color:var(--acc);font-style:normal}
.seg{display:flex;background:var(--s);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:700}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
.btn{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:8px 13px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
.btn.del{color:#e24b4b}
.btn:focus-visible,.card:focus-visible,.pill:focus-visible,.seg button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.hero h1{margin:0 0 2px;font-size:22px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--mut)}
.pill{border:1px solid var(--line);background:var(--s);border-radius:99px;padding:5px 13px;cursor:pointer;color:var(--mut)}
.pill[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
input[type=text],input[type=search],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:10px 12px}
.bar{display:grid;gap:10px;margin-bottom:6px}
h2{font-size:18px;margin:22px 0 10px}
h2 small{color:var(--mut);font-weight:500;font-size:14px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{display:block;width:100%;padding:0;margin:0;border:0;background:none;text-align:left;cursor:pointer}
.poster{position:relative;height:0;padding-top:150%;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,var(--s2),var(--line))}
.poster img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:0;right:0;bottom:0;padding:26px 9px 8px;background:linear-gradient(transparent,rgba(8,10,20,.92));color:#fff}
.cap b{display:block;line-height:1.2;font-size:14px}
.cap span{font-size:12px;opacity:.8}
.tag{position:absolute;left:7px;top:7px;font-size:12px;font-weight:700;color:#fff;border-radius:7px;padding:2px 8px}
.rate{position:absolute;right:7px;top:7px;font-size:12px;font-weight:700;background:rgba(8,10,20,.78);color:#ffc857;border-radius:7px;padding:2px 7px}
.s-watched{background:var(--w)}.s-plan{background:var(--p)}.s-watching{background:var(--n)}.s-up{background:rgba(8,10,20,.78)}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:16px;padding:18px;width:min(94vw,480px);background:var(--s);color:var(--ink);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(5,7,15,.65)}
label{display:block;font-weight:700;margin:12px 0 4px}
.res{display:grid;gap:8px;margin-top:10px}
.hit{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;border:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.hit:hover{border-color:var(--acc)}
.hit img,.hit .ph{width:44px;height:66px;border-radius:6px;object-fit:cover;background:var(--line);flex:none}
.note{color:var(--mut);font-size:14px}
.star{background:none;border:0;font-size:30px;cursor:pointer;color:var(--line);padding:0 2px}
.star.on{color:var(--p)}
.pv{display:flex;gap:12px;align-items:center}
.pv img{width:60px;height:90px;border-radius:8px;object-fit:cover}
.segc{display:flex;gap:6px;background:var(--s2);border-radius:12px;padding:4px}
.segc button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;cursor:pointer;color:var(--mut);font-weight:700}
.segc button[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 4px}
.fold{display:flex;align-items:center;gap:8px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--s);cursor:pointer;text-align:left}
.fold svg{color:var(--acc);flex:none}
.fold b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold small{color:var(--mut)}
.fold.new{border-style:dashed;color:var(--mut);justify-content:center;font-weight:700}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.crumb b{font-size:20px}.grow{flex:1}
#mdlg{width:min(90vw,380px)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="nav"><div class="nav-in">
  <div class="brand">Movie<i>Verse</i></div>
  <div class="seg" id="views">
    <button data-v="shelf" aria-pressed="true">My shelf</button>
    <button data-v="up" aria-pressed="false">Upcoming</button>
  </div>
  <button class="btn" id="set">Settings</button>
</div></div>

<div class="wrap">
  <section id="shelf">
    <div class="hero row" style="justify-content:space-between">
      <div><h1>My shelf</h1><p id="stat"></p></div>
      <div class="row"><button class="btn" id="copy">Copy list</button><button class="btn pri" id="add">Add movie</button></div>
    </div>
    <div class="bar">
      <div class="row" id="tabs"></div>
      <input type="search" id="q" placeholder="Search my shelf">
      <div class="row" id="chips"></div>
    </div>
    <div id="fold"></div>
    <div id="list"></div>
  </section>

  <section id="up" hidden>
    <div class="hero"><h1>Upcoming movies</h1><p>Releases still to come. Pick a country to see its films.</p></div>
    <div class="row" id="uchips" style="margin-bottom:6px"></div>
    <div id="ulist"></div>
    <div class="row" style="justify-content:center;margin:18px 0"><button class="btn" id="more" hidden>Load more</button></div>
  </section>
</div>

<dialog id="dlg">
  <div id="find">
    <h2 style="margin-top:0">Add a movie</h2>
    <input type="search" id="qs" placeholder="Type a movie name">
    <div class="res" id="res"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="manual">Add without poster</button>
      <button class="btn" data-close>Cancel</button>
    </div>
  </div>
  <div id="form" hidden>
    <div class="pv"><div id="pvimg"></div><h2 id="pvt" style="margin:0"></h2></div>
    <label for="ft">Title</label><input type="text" id="ft">
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
      <div style="flex:1"><label for="fy">Year</label><input type="text" id="fy" inputmode="numeric"></div>
      <div style="flex:2"><label for="fc">Country</label><input type="text" id="fc" placeholder="e.g. South Korea"></div>
    </div>
    <div class="row" id="csug" style="margin-top:8px"></div>
    <label>Status</label><div class="segc" id="fsb"></div>
    <label>Folder</label><div class="row" id="ffol"></div>
    <label>My rating</label><div id="stars"></div>
    <label for="fn">Note</label><textarea id="fn" rows="3" placeholder="Why would you suggest it?"></textarea>
    <div class="row" style="margin-top:16px">
      <button class="btn pri" id="save">Save movie</button>
      <button class="btn" data-close>Cancel</button>
      <button class="btn del" id="del" hidden style="margin-left:auto">Delete</button>
    </div>
  </div>
</dialog>

<dialog id="sdlg">
  <h2 style="margin-top:0">Settings</h2>
  <label for="key">TMDB API key (or read access token)</label>
  <input type="password" id="key" autocomplete="off">
  <p class="note">Free at themoviedb.org: Settings, then API. Saved only in this browser or app.</p>
  <div class="row">
    <button class="btn pri" id="ksave">Save key</button>
    <button class="btn" id="exp">Export backup</button>
    <button class="btn" id="imp">Import backup</button>
    <button class="btn" id="impt">Paste backup text</button>
    <button class="btn" data-close>Close</button>
  </div>
  <input type="file" id="file" accept=".json" hidden>
</dialog>

<dialog id="mdlg"><h2 id="mt" style="margin-top:0"></h2><p class="note" id="mx"></p><input type="text" id="mi" hidden><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="mno">Cancel</button><button class="btn pri" id="mok">OK</button></div></dialog>
<dialog id="bdlg"><h2 id="bt" style="margin-top:0"></h2><p class="note" id="bn"></p><textarea id="bx" rows="8"></textarea><div class="row" style="margin-top:12px"><button class="btn pri" id="bgo">Copy</button><button class="btn" data-close>Close</button></div></dialog>
<div id="toast"></div>
<script>
var $=function(s){return document.querySelector(s)};
var IMG='https://image.tmdb.org/t/p/';
var LS=window.localStorage;
var movies=JSON.parse(LS.getItem('shelf.movies')||'[]');
var key=LS.getItem('shelf.key')||'';
var tab='all',country='all',q='',pick=null,editId=null,rating=0,timer;
var uc='',upage=1,uitems=[];
var folders=JSON.parse(LS.getItem('shelf.folders')||'[]'),folder=null,fstat='watched',fsel=null,curStatus='watched',tt;
var FI='<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
var SL={watched:'Watched',plan:'Plan to watch',watching:'Watching'};
var CO=[['','All countries'],['BD','Bangladesh'],['IN','India'],['US','United States'],['KR','South Korea'],['JP','Japan'],['GB','United Kingdom'],['FR','France'],['CN','China'],['TR','Turkey'],['TH','Thailand'],['ES','Spain'],['DE','Germany'],['IT','Italy'],['PK','Pakistan']];
function store(){LS.setItem('shelf.movies',JSON.stringify(movies))}
function saveF(){LS.setItem('shelf.folders',JSON.stringify(folders))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function toast(t){var e=$('#toast');e.textContent=t;e.className='show';clearTimeout(tt);tt=setTimeout(function(){e.className=''},2600)}
function modal(o){return new Promise(function(res){
  var d=$('#mdlg'),i=$('#mi'),ok=$('#mok');
  $('#mt').textContent=o.title;$('#mx').textContent=o.text||'';
  i.hidden=!o.input;i.value=o.value||'';i.placeholder=o.placeholder||'';
  ok.textContent=o.ok||'OK';ok.className='btn '+(o.danger?'del':'pri');
  var done=function(v){d.onclose=null;d.close();res(v)};
  ok.onclick=function(){var v=o.input?i.value.trim():true;if(o.input&&!v){i.focus();return}done(v)};
  $('#mno').onclick=function(){done(null)};
  d.onclose=function(){res(null)};
  d.showModal();if(o.input)i.focus();
})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function tmdb(path,params){
  var u=new URL('https://api.themoviedb.org/3'+path),h={};
  if(key.length>40)h.Authorization='Bearer '+key;else u.searchParams.set('api_key',key);
  for(var k in (params||{}))u.searchParams.set(k,params[k]);
  return fetch(u.toString(),{headers:h}).then(function(r){
    if(!r.ok)throw new Error(r.status==401?'That API key was not accepted.':'TMDB error '+r.status);
    return r.json();
  });
}
function img(p,size){return p?'<img src="'+IMG+(size||'w342')+p+'" alt="" loading="lazy">':''}

/* ---------- shelf ---------- */
function render(){
  var fo=folders.filter(function(f){return f.status===tab});
  if(folder&&!fo.some(function(f){return f.id===folder}))folder=null;
  var cnt=function(s){return movies.filter(function(m){return m.status===s}).length};
  $('#stat').textContent=cnt('watched')+' watched · '+cnt('plan')+' to watch · '+new Set(movies.map(function(m){return m.country}).filter(Boolean)).size+' countries';
  $('#tabs').innerHTML=['all','watched','plan','watching'].map(function(t){
    return '<button class="pill" data-tab="'+t+'" aria-pressed="'+(tab===t)+'">'+(t==='all'?'All '+movies.length:SL[t]+' '+cnt(t))+'</button>'}).join('');
  var inTab=movies.filter(function(m){return tab==='all'||(m.status===tab&&(folder?m.folder===folder:!m.folder))});
  var cs={};inTab.forEach(function(m){var c=m.country||'Other';cs[c]=(cs[c]||0)+1});
  if(country!=='all'&&!cs[country])country='all';
  var keys=Object.keys(cs).sort();
  $('#chips').innerHTML=keys.length?['<button class="pill" data-c="all" aria-pressed="'+(country==='all')+'">All countries</button>'].concat(keys.map(function(c){return '<button class="pill" data-c="'+esc(c)+'" aria-pressed="'+(country===c)+'">'+esc(c)+' '+cs[c]+'</button>'})).join(''):'';
  var h='';
  if(tab!=='all'){
    if(folder){
      var cf=fo.filter(function(f){return f.id===folder})[0];
      h='<div class="crumb"><button class="pill" data-fa="back">← '+SL[tab]+'</button><b>'+esc(cf.name)+'</b><span class="grow"></span><button class="pill" data-fa="ren">Rename</button><button class="pill" data-fa="del">Delete folder</button></div>';
    }else{
      h='<div class="folders">'+fo.map(function(f){var n=movies.filter(function(m){return m.folder===f.id}).length;return '<button class="fold" data-f="'+f.id+'">'+FI+'<b>'+esc(f.name)+'</b><small>'+n+'</small></button>'}).join('')+'<button class="fold new" data-fa="new">+ New folder</button></div>';
    }
  }
  $('#fold').innerHTML=h;
  var list=inTab.filter(function(m){return (country==='all'||(m.country||'Other')===country)&&m.title.toLowerCase().indexOf(q.toLowerCase())>-1}).sort(function(a,b){return b.added-a.added});
  if(!list.length){$('#list').innerHTML='<div class="empty">'+(folder?'This folder is empty. Tap Add movie to put the first film in it.':movies.length?'No movies match this view.':'Your shelf is empty. Tap Add movie, or browse Upcoming.')+'</div>';return}
  var g={};list.forEach(function(m){var c=m.country||'Other';(g[c]=g[c]||[]).push(m)});
  $('#list').innerHTML=Object.keys(g).sort().map(function(c){
    return '<h2>'+esc(c)+'<small>'+g[c].length+'</small></h2><div class="grid">'+g[c].map(function(m){
      return '<button class="card" data-id="'+m.id+'"><div class="poster">'+img(m.poster)+'<span class="tag s-'+m.status+'">'+SL[m.status]+'</span>'+(m.rating?'<span class="rate">★ '+m.rating+'</span>':'')+'<div class="cap"><b>'+esc(m.title)+'</b><span>'+esc(m.year)+'</span></div></div></button>'}).join('')+'</div>'}).join('');
}

/* ---------- upcoming ---------- */
function drawUC(){
  $('#uchips').innerHTML=CO.map(function(c){return '<button class="pill" data-u="'+c[0]+'" aria-pressed="'+(uc===c[0])+'">'+c[1]+'</button>'}).join('');
}
function loadUp(reset){
  if(reset){upage=1;uitems=[]}
  drawUC();
  if(!key){$('#ulist').innerHTML='<div class="empty">Add your TMDB API key in Settings to see upcoming movies.</div>';$('#more').hidden=true;return}
  if(reset)$('#ulist').innerHTML='<div class="empty">Loading…</div>';
  var p={'primary_release_date.gte':new Date().toISOString().slice(0,10),include_adult:'false',page:upage,sort_by:uc?'primary_release_date.asc':'popularity.desc'};
  if(uc)p.with_origin_country=uc;
  tmdb('/discover/movie',p).then(function(d){
    uitems=uitems.concat(d.results.filter(function(m){return m.poster_path}));
    $('#more').hidden=upage>=d.total_pages;
    drawUp();
  }).catch(function(e){$('#ulist').innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
}
function drawUp(){
  if(!uitems.length){$('#ulist').innerHTML='<div class="empty">No upcoming movies found for this country yet.</div>';return}
  var on=movies.map(function(m){return m.tmdbId});
  $('#ulist').innerHTML='<div class="grid">'+uitems.map(function(m){
    return '<button class="card" data-up="'+m.id+'"><div class="poster">'+img(m.poster_path)+'<span class="tag s-up">'+(on.indexOf(m.id)>-1?'On shelf':esc(fmt(m.release_date)))+'</span><div class="cap"><b>'+esc(m.title)+'</b><span>'+esc((m.release_date||'').slice(0,4))+'</span></div></div></button>'}).join('')+'</div>';
}
function fmt(d){if(!d)return 'TBA';var a=d.split('-'),M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return a[2]+' '+M[a[1]-1]+' '+a[0]}

/* ---------- add / edit ---------- */
function drawStars(){$('#stars').innerHTML=[1,2,3,4,5].map(function(i){return '<button type="button" class="star '+(i<=rating?'on':'')+'" data-r="'+i+'" aria-label="'+i+' star">★</button>'}).join('')}
function drawSeg(){
  $('#fsb').innerHTML=['watched','plan','watching'].map(function(s){return '<button type="button" data-s="'+s+'" aria-pressed="'+(fstat===s)+'">'+SL[s]+'</button>'}).join('');
  var fo=folders.filter(function(f){return f.status===fstat});
  $('#ffol').innerHTML=fo.length?[{id:null,name:'No folder'}].concat(fo).map(function(f){return '<button type="button" class="pill" data-fo="'+(f.id||'')+'" aria-pressed="'+((fsel||null)===f.id)+'">'+esc(f.name)+'</button>'}).join(''):'<span class="note">No folders in '+SL[fstat]+' yet. Create one from the shelf.</span>';
}
function drawSug(){
  var all=movies.map(function(m){return m.country}).concat(['India','South Korea','Japan','United States of America','United Kingdom','Bangladesh','France','China']).filter(Boolean);
  $('#csug').innerHTML=Array.from(new Set(all)).slice(0,8).map(function(c){return '<button type="button" class="pill" data-cs="'+esc(c)+'" aria-pressed="false">'+esc(c)+'</button>'}).join('');
}
function showForm(m,isEdit){
  $('#find').hidden=true;$('#form').hidden=false;
  $('#pvimg').innerHTML=m.poster?'<img src="'+IMG+'w185'+m.poster+'" alt="">':'';
  $('#pvt').textContent=m.title||'New movie';
  $('#ft').value=m.title||'';$('#fy').value=m.year||'';$('#fc').value=m.country||'';
  $('#fn').value=m.note||'';
  fstat=m.status||'watched';fsel=m.folder||null;drawSeg();drawSug();
  rating=m.rating||0;drawStars();$('#del').hidden=!isEdit;
}
function openAdd(){
  curStatus=tab==='all'?'watched':tab;
  editId=null;pick=null;$('#form').hidden=true;$('#find').hidden=false;$('#qs').value='';
  $('#res').innerHTML=key?'':'<p class="note">Add your TMDB API key in Settings to search with posters. You can still add a movie without a poster.</p>';
  $('#dlg').showModal();
}
function search(){
  var t=$('#qs').value.trim();if(!t||!key)return;
  $('#res').innerHTML='<p class="note">Searching…</p>';
  tmdb('/search/movie',{query:t,include_adult:'false'}).then(function(d){
    var r=d.results.slice(0,8);
    $('#res').innerHTML=r.length?r.map(function(x){return '<button class="hit" data-t="'+x.id+'">'+(x.poster_path?'<img src="'+IMG+'w92'+x.poster_path+'" alt="">':'<div class="ph"></div>')+'<span><b>'+esc(x.title)+'</b><br><span class="note">'+esc((x.release_date||'').slice(0,4))+'</span></span></button>'}).join(''):'<p class="note">No results. Try another spelling, or add it without a poster.</p>';
  }).catch(function(e){$('#res').innerHTML='<p class="note">'+esc(e.message)+'</p>'});
}
function choose(id,status,fromUp){
  tmdb('/movie/'+id).then(function(d){
    pick={tmdbId:d.id,title:d.title,year:(d.release_date||'').slice(0,4),poster:d.poster_path,country:(d.production_countries[0]||{}).name||'',status:status,folder:fromUp?null:folder};
    editId=null;showForm(pick,false);
    if(fromUp)$('#dlg').showModal();
  }).catch(function(e){if(fromUp)toast(e.message);else $('#res').innerHTML='<p class="note">'+esc(e.message)+'</p>'});
}

/* ---------- events ---------- */
$('#add').onclick=openAdd;
$('#qs').oninput=function(){clearTimeout(timer);timer=setTimeout(search,450)};
$('#res').onclick=function(e){var b=e.target.closest('[data-t]');if(b)choose(b.dataset.t,curStatus,false)};
$('#manual').onclick=function(){pick={title:$('#qs').value.trim(),poster:null,status:curStatus,folder:folder};showForm(pick,false)};
$('#stars').onclick=function(e){var b=e.target.closest('[data-r]');if(!b)return;var r=+b.dataset.r;rating=rating===r?0:r;drawStars()};
document.addEventListener('click',function(e){var c=e.target.closest('[data-close]');if(c)c.closest('dialog').close()});
$('#save').onclick=function(){
  var title=$('#ft').value.trim();if(!title){$('#ft').focus();return}
  var d={title:title,year:$('#fy').value.trim(),country:$('#fc').value.trim(),status:fstat,folder:fsel,note:$('#fn').value.trim(),rating:rating};
  if(editId){Object.assign(movies.find(function(m){return m.id===editId}),d)}
  else movies.push(Object.assign(d,{id:Date.now()+Math.random().toString(36).slice(2,6),poster:pick&&pick.poster,tmdbId:pick&&pick.tmdbId,added:Date.now()}));
  store();$('#dlg').close();render();if(!$('#up').hidden)drawUp();
};
$('#del').onclick=function(){modal({title:'Delete this movie?',text:'It will be removed from your shelf.',ok:'Delete',danger:true}).then(function(y){if(y){movies=movies.filter(function(m){return m.id!==editId});store();$('#dlg').close();render()}})};
$('#list').onclick=function(e){var c=e.target.closest('[data-id]');if(!c)return;var m=movies.find(function(x){return x.id===c.dataset.id});editId=m.id;pick=m;showForm(m,true);$('#dlg').showModal()};
$('#tabs').onclick=function(e){var b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;folder=null;country='all';render()}};
$('#chips').onclick=function(e){var b=e.target.closest('[data-c]');if(b){country=b.dataset.c;render()}};
$('#q').oninput=function(e){q=e.target.value;render()};
$('#uchips').onclick=function(e){var b=e.target.closest('[data-u]');if(b){uc=b.dataset.u;loadUp(true)}};
$('#more').onclick=function(){upage++;loadUp(false)};
$('#ulist').onclick=function(e){var c=e.target.closest('[data-up]');if(c)choose(+c.dataset.up,'plan',true)};
$('#views').onclick=function(e){
  var b=e.target.closest('[data-v]');if(!b)return;
  var v=b.dataset.v;
  Array.prototype.forEach.call($('#views').children,function(x){x.setAttribute('aria-pressed',x===b)});
  $('#shelf').hidden=v!=='shelf';$('#up').hidden=v!=='up';
  if(v==='up'&&!uitems.length)loadUp(true);
};
$('#copy').onclick=function(){
  var l=movies.filter(function(m){return (tab==='all'||m.status===tab)&&(country==='all'||(m.country||'Other')===country)});
  var t=l.map(function(m){return m.title+(m.year?' ('+m.year+')':'')+(m.country?' - '+m.country:'')+(m.rating?' - '+stars(m.rating):'')}).join('\n');
  var done=function(){$('#copy').textContent='Copied';setTimeout(function(){$('#copy').textContent='Copy list'},1500)};
  if(navigator.clipboard)navigator.clipboard.writeText(t||'(empty)').then(done,function(){toast('Could not copy')});else toast('Could not copy');
};
$('#set').onclick=function(){$('#key').value=key;$('#sdlg').showModal()};
$('#ksave').onclick=function(){key=$('#key').value.trim();LS.setItem('shelf.key',key);$('#sdlg').close();uitems=[];if(!$('#up').hidden)loadUp(true)};
function textDlg(mode,txt,why){
  $('#sdlg').close();
  $('#bt').textContent=mode==='out'?'Your backup':'Paste backup text';
  $('#bn').textContent=mode==='out'?'Tap Copy, then paste it into Notes, WhatsApp or Drive to keep it safe.'+(why?' ('+why+')':''):'Paste the backup text you copied earlier.';
  $('#bx').value=txt||'';$('#bx').readOnly=mode==='out';
  $('#bgo').textContent=mode==='out'?'Copy':'Import';
  $('#bgo').onclick=function(){
    if(mode==='out'){$('#bx').select();(navigator.clipboard?navigator.clipboard.writeText($('#bx').value):Promise.reject()).then(function(){toast('Copied')},function(){document.execCommand('copy');toast('Copied')})}
    else{$('#bdlg').close();importData($('#bx').value)}
  };
  $('#bdlg').showModal();
}
function exportBackup(){
  var txt=JSON.stringify({movies:movies,folders:folders},null,1),name='movieverse-backup-'+new Date().toISOString().slice(0,10)+'.json';
  var C=window.Capacitor,P=C&&C.Plugins,native=C&&C.isNativePlatform&&C.isNativePlatform();
  if(native){
    var F=P&&P.Filesystem;
    if(!F){textDlg('out',txt,'Backup plugin is missing in this APK build');return}
    Promise.resolve(F.requestPermissions?F.requestPermissions():0).catch(function(){}).then(function(){
      return F.writeFile({path:'MovieVerse/'+name,data:txt,directory:'DOCUMENTS',encoding:'utf8',recursive:true});
    }).then(function(){$('#sdlg').close();toast('Saved: Documents/MovieVerse/'+name)}).catch(function(e){
      var why=(e&&e.message)||'';
      if(P.Share)F.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'}).then(function(r){return P.Share.share({title:'MovieVerse backup',url:r.uri})}).catch(function(x){if(!/cancel/i.test((x&&x.message)||''))textDlg('out',txt,why)});
      else textDlg('out',txt,why);
    });
    return;
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  $('#sdlg').close();toast('Backup downloaded');
}
$('#exp').onclick=exportBackup;
$('#imp').onclick=function(){$('#file').click()};
function importData(t){
  try{
    var o=JSON.parse(t),d=Array.isArray(o)?o:o.movies;if(!Array.isArray(d))throw 0;
    (o.folders||[]).forEach(function(f){if(!folders.some(function(x){return x.id===f.id}))folders.push(f)});saveF();
    var ids=movies.map(function(m){return m.id});
    d.forEach(function(m){if(m&&m.title&&ids.indexOf(m.id)<0)movies.push(m)});
    store();render();$('#sdlg').close();toast('Backup imported');
  }catch(x){$('#sdlg').close();toast('That is not a valid backup.')}
}
$('#file').onchange=function(e){e.target.files[0].text().then(importData)};
$('#impt').onclick=function(){textDlg('in','')};
$('#fsb').onclick=function(e){var b=e.target.closest('[data-s]');if(!b)return;fstat=b.dataset.s;if(fsel&&!folders.some(function(f){return f.id===fsel&&f.status===fstat}))fsel=null;drawSeg()};
$('#ffol').onclick=function(e){var b=e.target.closest('[data-fo]');if(b){fsel=b.dataset.fo||null;drawSeg()}};
$('#csug').onclick=function(e){var b=e.target.closest('[data-cs]');if(b)$('#fc').value=b.dataset.cs};
$('#fold').onclick=function(e){
  var f=e.target.closest('[data-f]');if(f){folder=f.dataset.f;country='all';render();return}
  var a=e.target.closest('[data-fa]');if(!a)return;var k=a.dataset.fa;
  if(k==='back'){folder=null;render();return}
  if(k==='new'){modal({title:'New folder in '+SL[tab],input:true,placeholder:'e.g. South Indian',ok:'Create'}).then(function(n){if(n){folders.push({id:uid(),name:n,status:tab});saveF();render()}});return}
  var cf=folders.filter(function(x){return x.id===folder})[0];
  if(k==='ren')modal({title:'Rename folder',input:true,value:cf.name,ok:'Save'}).then(function(n){if(n){cf.name=n;saveF();render()}});
  else modal({title:'Delete "'+cf.name+'"?',text:'The movies stay in '+SL[tab]+'. Only the folder is removed.',ok:'Delete',danger:true}).then(function(y){if(y){movies.forEach(function(m){if(m.folder===cf.id)m.folder=null});folders=folders.filter(function(x){return x!==cf});folder=null;store();saveF();render()}});
};
render();
</script>
</body>
</html>
